# cargo-deny — dependency-graph security / license / source policy for siphon-http.
# Local: `cargo deny check`
# CI is split by what the check depends on:
#   bans / licenses / sources — a function of the dependency graph only, so they
#     gate every pull request (.github/workflows/ci.yaml, job `deny`).
#   advisories — time-varying (a new RustSec entry can land against a dependency
#     nobody touched), so they run weekly and on main instead of blocking a PR
#     for something that PR did not cause (.github/workflows/audit.yml).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste — unmaintained transitive (no vuln); pulled via the pyo3 stack.
    # Remove once the parent crate drops it.
    "RUSTSEC-2024-0436",
]

[bans]
# Both stay at "warn" on purpose, so the PR gate reports duplicates without
# failing on them:
#   multiple-versions — nearly all of the current duplicates (tower-http, the
#     RustCrypto stack, getrandom/rand) are pulled in twice by siphon-sip's own
#     tree. siphon-http cannot unify them; denying here would block every PR on
#     an upstream version bump. Revisit once the siphon-sip graph converges.
#   wildcards — `siphon-sip` is a permanent git dependency with no version
#     requirement, which is exactly what this check flags.
multiple-versions = "warn"
wildcards = "warn"
# siphon-http embeds CPython via PyO3 (links libpython); that C dependency is
# intentional, so there is no C-FFI ban list here.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",             # public-domain dedication (transitive deps)
    "CDLA-Permissive-2.0", # webpki-roots cert bundle
    "BSL-1.0",             # Boost Software License (permissive, OSI)
    "OpenSSL",             # aws-lc-rs / ring vendored crypto
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# siphon-sip (the host platform) is consumed as a permanent git dependency —
# siphon-http is an extension, not a crates.io crate.
allow-git = ["https://github.com/siphon-project/siphon-sip"]
